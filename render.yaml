services:
  - type: web
    name: payment-verifier
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PORT
        value: 10000
      # AI vision extraction (/api/verify/vision). Set OPENROUTER_API_KEY in the Render
      # dashboard (never commit it). VISION_MODEL can be changed there to swap models.
      - key: VISION_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_API_KEY
        sync: false
      # verify.et bank-verification key. Server-side secret; set in the dashboard, never commit.
      # Rotating it here is all that's needed - no app rebuild.
      - key: VERIFY_ET_API_KEY
        sync: false
